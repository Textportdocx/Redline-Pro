<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171a2b"/><stop offset="1" stop-color="#0b0d17"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5a6e"/><stop offset="1" stop-color="#ff8a4c"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ee6b8"/><stop offset="1" stop-color="#22b8e8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd35a"/><stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="46" fill="url(#bg)"/>
  <rect x="3" y="3" width="250" height="250" rx="43" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="2"/>

  <!-- back document (rose) -->
  <g filter="url(#sh)">
    <path d="M40 38 H98 L124 64 V150 H40 Z" fill="#1b1424" stroke="url(#rose)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M98 38 V64 H124" fill="none" stroke="url(#rose)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="49" y="46" width="34" height="16" rx="4" fill="url(#rose)"/>
    <text x="66" y="58.5" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="12" fill="#1b1424" text-anchor="middle">PDF</text>
    <path d="M52 82 H108 M52 98 H100 M52 114 H108" stroke="url(#rose)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- front document (teal) -->
  <g filter="url(#sh)">
    <path d="M118 78 H174 L200 104 V212 H118 Z" fill="#0f1c24" stroke="url(#teal)" stroke-width="7" stroke-linejoin="round"/>
    <path d="M174 78 V104 H200" fill="none" stroke="url(#teal)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M160 146 H190 M160 162 H184" stroke="url(#teal)" stroke-width="6" stroke-linecap="round"/>
    <!-- signature -->
    <path d="M130 198 q8 -14 14 -2 t12 -2 t14 -2" fill="none" stroke="url(#teal)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  </g>

  <!-- pencil (edit) -->
  <g transform="translate(214 146) rotate(40)" filter="url(#sh)">
    <rect x="-7" y="-40" width="14" height="60" rx="2" fill="url(#gold)"/>
    <rect x="-7" y="-40" width="14" height="10" rx="2" fill="#ff5a6e"/>
    <path d="M-7 20 L0 36 L7 20 Z" fill="#f6e3c3"/>
    <path d="M-2.6 31 L0 36 L2.6 31 Z" fill="#22262e"/>
  </g>

  <!-- magnifier -->
  <g filter="url(#sh)">
    <line x1="140" y1="140" x2="172" y2="172" stroke="url(#gold)" stroke-width="15" stroke-linecap="round"/>
    <circle cx="102" cy="104" r="42" fill="#0b0d17" fill-opacity=".35" stroke="url(#gold)" stroke-width="11"/>
    <circle cx="102" cy="104" r="37" fill="url(#glass)"/>
    <path d="M78 88 a30 30 0 0 1 22 -16" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- share nodes -->
  <g stroke="url(#gold)" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="86" y1="110" x2="102" y2="96"/><line x1="102" y1="96" x2="118" y2="106"/><line x1="102" y1="96" x2="104" y2="122"/>
  </g>
  <g fill="url(#gold)">
    <circle cx="86" cy="110" r="7"/><circle cx="102" cy="96" r="8"/><circle cx="118" cy="106" r="7"/><circle cx="104" cy="122" r="6"/>
  </g>
</svg>
